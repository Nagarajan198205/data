<text x="48" y="935" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#18334c">Own-engine boundary: native detectors coexist with optional imports, advisory feeds, policy tools and utility integrations. No zero-dependency claim.</text>
<text x="48" y="958" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#18334c">Retest-backed and manual closure paths differ. Do not equate every fixed status with a verified fix. Source detail: intellisec_analysis.txt.</text>
