<text x="62" y="892" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#18334c">Rule edits, prompt edits, RAG updates and fine-tuning are separate mechanisms. A false-positive review need not trigger all four.</text>
<text x="48" y="935" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#18334c">Solid links show inspected workflow connections. Dashed links show intended/manual or external execution; they are not claimed autonomous.</text>
<text x="48" y="958" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#18334c">Dataset overlap must be resolved before independent uplift claims. A generated HTML fixture is a test case, not evidence of a client outcome.</text>
<polyline points="48,985 1412,985" fill="none" stroke="#d4dfe8" stroke-width="1.8"/>
<text x="48" y="1010" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#52708b">Solid = inspected source path. Dashed = optional or human/external hand-off. Code presence does not prove deployment or outcomes.</text>
