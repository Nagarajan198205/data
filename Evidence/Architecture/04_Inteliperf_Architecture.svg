<text x="62" y="892" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#18334c">Prototype boundary: auto-remediation actions and rollback are simulated. Mock regional runners are not proof of live distributed execution.</text>
<text x="48" y="935" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#18334c">Own-engine boundary: the inspected core invokes InternalRunner and native requests, not k6/JMeter executables. AI and imports are separate components.</text>
<text x="48" y="958" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#18334c">Calibration can estimate capacity; scoring and comparison semantics need runtime validation. Separate from client PerfOps / Perf Insights. See inteliperf_analysis.txt.</text>
<polyline points="48,985 1412,985" fill="none" stroke="#d4dfe8" stroke-width="1.8"/>
<text x="48" y="1010" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#52708b">Solid = inspected source path. Dashed = optional or human/external hand-off. Code presence does not prove deployment or outcomes.</text>
